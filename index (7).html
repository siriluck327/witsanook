<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิทย์สนุก – คลังข้อสอบวิทยาศาสตร์ การศึกษานอกระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2346;--ink2:#4A4F6E;--cream:#FFF6E5;--paper:#FFF9EE;--yellow:#FFC93C;--green:#2FB67A;--green2:#C8F2DA;--pink:#FF8FA3;--pink2:#FFE0E6;--blue:#2F5BE0;--sky:#DCEFFF;--purple:#EAE2FF;--orange:#FFE3C2;--line:#E6DCC6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;color:var(--ink);background:var(--cream);background-image:radial-gradient(#F0DDB8 1.6px,transparent 1.6px);background-size:28px 28px;min-height:100vh;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.disp{font-family:'Mitr','Prompt',system-ui,sans-serif}
h1,h2,h3{font-family:'Mitr','Prompt',system-ui,sans-serif;margin:0;line-height:1.3}
a{color:var(--blue)}
.wrap{max-width:1320px;margin:0 auto;padding:18px 24px 60px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drop:focus-within{outline:4px solid #FF8A3D;outline-offset:2px}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo-badge{width:56px;height:56px;border-radius:18px;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.logo b{display:block;font-family:Mitr,sans-serif;font-size:26px;line-height:1.1}
.logo small{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
.nav-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 8px;box-shadow:0 4px 0 var(--ink);font-family:Mitr,sans-serif;font-size:17px;font-weight:600}
.navlink{background:transparent;border:0;font-weight:700;font-size:16px;padding:10px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.navlink:hover{background:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);background:#fff;border-radius:18px;box-shadow:0 5px 0 var(--ink);font-weight:700;font-size:17px;padding:10px 20px;min-height:52px;cursor:pointer;transition:transform .15s ease;text-decoration:none;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.yellow{background:var(--yellow)}.btn.green{background:var(--green)}.btn.dark{background:var(--ink);color:var(--cream)}.btn.pink{background:var(--pink2)}
.btn.big{font-size:20px;min-height:60px;padding:12px 28px}
.btn.sm{min-height:44px;font-size:15px;padding:6px 14px;border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:2.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;flex:none}
.icon-btn:hover{transform:scale(1.07)}
.chip{min-height:44px;padding:0 16px;border-radius:14px;border:2.5px solid var(--ink);font-size:15px;font-weight:700;background:#fff;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--cream);box-shadow:none}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;white-space:nowrap}

/* cards */
.card{background:#fff;border:3px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink);padding:26px}
.soft{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px 20px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.inp{height:48px;border:2.5px solid var(--ink);border-radius:14px;padding:0 14px;font-size:16px;background:var(--paper);width:100%}
textarea.inp{height:auto;padding:10px 14px;resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink2);font-weight:500}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:32px 0 16px}
.sec-head h2{font-size:32px}

/* hero */
.hero{position:relative;border-radius:44px;background-color:var(--blue);background-image:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2px);background-size:26px 26px;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--ink);overflow:hidden;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:20px;padding:40px 48px;color:#fff}
.hero h1{font-size:54px;font-weight:700;line-height:1.18}
.hero h1 span{color:#FFE27A}
.hero p{font-size:19px;line-height:1.6;color:#EAF0FF;margin:14px 0 22px;max-width:560px}
.hero .badge{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:700;font-size:15px;margin-bottom:16px}
.hero-art{position:relative;height:340px}
.hero-art .mascot{position:absolute;left:50%;top:10px;margin-left:-150px}
.hero-art .bubble{position:absolute;left:0;top:0;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:22px 22px 22px 4px;padding:10px 16px;font-family:Mitr,sans-serif;font-size:17px;box-shadow:0 5px 0 var(--ink);z-index:2}
.hero-art .mini1{position:absolute;left:0;bottom:10px}.hero-art .mini2{position:absolute;right:0;bottom:30px}
.hero.small{padding:28px 40px}
.hero.small .hero-art{height:230px}
.hero.small h1{font-size:42px}
.cloud{position:absolute;bottom:-30px;opacity:.16;pointer-events:none}

/* login */
.login{display:flex;flex-direction:column;gap:16px;color:var(--ink)}
.login h2{font-size:26px}

/* grades */
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.gcard .gcode{font-size:14px;font-weight:700;color:var(--ink2)}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.grid-stats .stat b{font-size:26px}.grid-stats .stat span{font-size:13px;line-height:1.3}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px 16px;border:3px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.gcard:hover{transform:translateY(-8px) rotate(-1.5deg)}
.gcard:hover .wig{animation:wiggle .6s ease-in-out infinite}
.gcard:disabled{opacity:.55;cursor:not-allowed;transform:none}
.gcard .gnum{font-family:Mitr,sans-serif;font-size:44px;font-weight:700;line-height:1.1}
.gcard .gsub{font-size:13px;font-weight:600}
.gcard .go{margin-top:8px;border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700}
.gcard .mine{position:absolute;top:-14px;right:-8px;background:var(--ink);color:var(--cream);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;transform:rotate(6deg)}
.strands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:28px}
.strand{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:24px;padding:12px 14px}
.strand .ic{flex:none;width:56px;height:56px;border-radius:16px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.prog{flex:1 1 200px;height:26px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.prog>div{height:100%;background-color:var(--green);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 10px,transparent 10px 20px);border-right:3px solid var(--ink);transition:width .4s ease}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.qcard{background:#fff;border:3px solid var(--ink);border-radius:36px;box-shadow:10px 10px 0 var(--ink);padding:34px 38px;display:flex;flex-direction:column;gap:24px}
.qcard h2{font-size:32px;font-weight:600;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opt{display:flex;align-items:center;gap:14px;min-height:84px;padding:12px 18px;border-radius:22px;border:3px solid var(--ink);font-size:20px;font-weight:600;line-height:1.4;text-align:left;background:#fff;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .12s ease}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:disabled{cursor:default;box-shadow:0 3px 0 var(--ink)}
.opt .l{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Mitr,sans-serif;font-size:22px;border:3px solid var(--ink);background:var(--cream)}
.opt.right{background:var(--green2)}.opt.right .l{background:var(--green)}
.opt.wrong{background:#FFD6DE}.opt.wrong .l{background:var(--pink)}
.opt.dim{opacity:.5}
.opt .t{flex:1}
.fb{display:flex;align-items:center;gap:20px;border:3px solid var(--ink);border-radius:26px;padding:20px 24px;flex-wrap:wrap}
.fb .txt{flex:1 1 280px;display:flex;flex-direction:column;gap:6px}
.fb .ttl{font-family:Mitr,sans-serif;font-size:22px;font-weight:600}
.side{display:flex;flex-direction:column;gap:22px}
.helper{border:3px solid var(--ink);border-radius:32px;padding:24px 20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:6px 6px 0 var(--ink)}
.helper .say{align-self:stretch;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-family:Mitr,sans-serif;font-size:18px;text-align:center;line-height:1.5}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:42px;height:42px;border-radius:14px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:Mitr,sans-serif;font-weight:600;background:#EFE7D6}
.dot.ok{background:var(--green)}.dot.no{background:var(--pink)}.dot.cur{background:var(--yellow);transform:scale(1.1)}

/* result */
.result{position:relative;display:grid;grid-template-columns:420px minmax(0,1fr);gap:30px}
.rleft{display:flex;flex-direction:column;align-items:center;gap:12px;background:#FFF1C7;border:3px solid var(--ink);border-radius:32px;padding:26px 20px;text-align:center}
.review{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border:3px solid var(--ink);border-radius:22px}
.rnum{flex:none;width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:Mitr,sans-serif;font-weight:600}
.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti{position:absolute;top:-30px;border:2px solid var(--ink);animation:fall linear forwards}
.save{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;border:2.5px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff}

/* teacher */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:18px;padding:10px 18px;font-weight:700;font-size:16px;background:#fff;cursor:pointer;min-height:52px}
.tab.on{background:var(--ink);color:var(--cream)}
.stat{display:flex;align-items:center;gap:14px;padding:14px 18px;border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink)}
.stat b{display:block;font-family:Mitr,sans-serif;font-size:30px;line-height:1.1}
.stat span{font-size:14px;font-weight:600}
.bank{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:26px;align-items:start}
.bank.noedit{grid-template-columns:minmax(0,1fr)}
.qitem{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:2px dashed var(--line)}
.qitem:hover{background:var(--paper)}
.qitem .num{flex:none;font-family:Mitr,sans-serif;font-weight:600;color:var(--ink2);width:40px}
.qitem .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.list{background:#fff;border:3px solid var(--ink);border-radius:26px;overflow:hidden}
.list-head{background:var(--ink);color:var(--cream);padding:12px 18px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.list-body{max-height:640px;overflow-y:auto}
.editor{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.optrow{display:flex;align-items:center;gap:10px}
.optrow input[type=radio]{width:22px;height:22px;accent-color:var(--green);margin:0;flex:none}
.optrow .lt{flex:none;width:34px;height:34px;border-radius:10px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:Mitr,sans-serif;font-weight:600;background:var(--cream)}
.empty{padding:40px;text-align:center;font-weight:600;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{background:var(--ink);color:var(--cream);text-align:left;padding:10px 12px;font-weight:700;position:sticky;top:0}
table.t td{padding:10px 12px;border-bottom:2px dashed var(--line);vertical-align:top}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{background:#fff;border:3px solid var(--ink);border-radius:24px;overflow:auto;max-height:520px}
.bars{display:flex;align-items:flex-end;gap:14px;height:220px;padding:10px 6px 0;border-bottom:2px solid var(--ink)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;position:relative}
.bar .v{font-family:Mitr,sans-serif;font-weight:600;font-size:16px}
.bar .col{width:70%;max-width:90px;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.bar:hover .col{background:#1E3FA8}
.bar .tip{display:none;position:absolute;bottom:100%;background:var(--ink);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap;z-index:3}
.bar:hover .tip{display:block}
.blabels{display:flex;gap:14px;padding:8px 6px 0}
.blabels span{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--ink2)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:320px;background:#fff;border:4px dashed var(--ink);border-radius:30px;text-align:center;padding:24px;cursor:pointer;transition:background .2s}
.drop:hover,.drop.over{background:#FFF1C7}
.drop:hover .ficon{animation:wiggle .6s ease-in-out infinite}
.impitem{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr) 230px;gap:14px}
.impitem.off{opacity:.7}
.impitem .ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.impitem .ops span{border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:14px;background:var(--paper)}
.impitem .ops span.ok{background:var(--green2)}
.impitem .ops span.miss{border-style:dashed;color:#B3263E;border-color:#E8435F}
.warn{display:inline-block;background:var(--orange);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:700;margin-top:8px}
.demo{background:#FFF1C7;border:2.5px dashed var(--ink);border-radius:18px;padding:10px 16px;font-weight:600;font-size:14px;margin-bottom:18px}
details.raw summary{cursor:pointer;font-weight:700}
details.raw pre{white-space:pre-wrap;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:12px;max-height:240px;overflow:auto;font-family:inherit;font-size:14px}

/* overlay + toast */
.busy{position:fixed;inset:0;background:rgba(31,35,70,.45);display:flex;align-items:center;justify-content:center;z-index:80}
.busy .box{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:24px 30px;display:flex;align-items:center;gap:16px;font-family:Mitr,sans-serif;font-size:19px;box-shadow:8px 8px 0 var(--ink)}
.spinner{width:36px;height:36px;border-radius:50%;border:5px solid #E9E3D6;border-top-color:var(--blue);animation:spin .8s linear infinite}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:12px 20px;font-weight:600;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:pop .3s ease both;max-width:90vw}
.toast.err{background:#B3263E}
.devnote{background:#fff;border:2.5px dashed var(--ink);border-radius:14px;padding:8px 14px;font-size:14px;font-weight:600;margin-bottom:16px}

/* print certificate */
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}#printArea img{width:100%;display:block}@page{size:A4 landscape;margin:0}body{background:#fff}}

/* motion */
.float{animation:float 4s ease-in-out infinite}.float2{animation:float 5s ease-in-out -2s infinite}
.spin-slow{animation:spin 16s linear infinite;transform-origin:160px 170px}
.wave{animation:wave 1.8s ease-in-out infinite;transform-origin:88px 178px}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
.bounce{animation:bounce 1.6s ease-in-out infinite}
.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
.flame{animation:flame .22s ease-in-out infinite alternate;transform-origin:60px 84px}
.scan{animation:scan 1.6s ease-in-out infinite alternate}
.stripes{animation:stripes 1s linear infinite;background-color:var(--yellow);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 10px,transparent 10px 20px);height:100%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes pop{0%{opacity:0;transform:scale(.9) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes flame{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@keyframes scan{from{transform:translate(-50px,-8px) rotate(-8deg)}to{transform:translate(50px,10px) rotate(8deg)}}
@keyframes stripes{from{background-position:0 0}to{background-position:40px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* responsive */
@media (max-width:1100px){
  .strands{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qgrid,.bank,.result{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap}.side>*{flex:1 1 260px}
  .editor{position:static;order:-1}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .wrap{padding:12px 16px 48px}
  .hero,.hero.small{grid-template-columns:1fr;padding:26px 22px;border-radius:32px}
  .hero h1{font-size:34px}.hero.small h1{font-size:30px}.hero p{font-size:17px}
  .hero-art{height:230px}.hero-art .mascot{transform:scale(.72);transform-origin:top center}
  .hero.small .hero-art{display:none}
  .grades{grid-template-columns:1fr;gap:14px}
  .strands{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .qcard{padding:22px 18px;border-radius:28px}.qcard h2{font-size:24px}
  .opt{font-size:18px;min-height:68px}
  .sec-head h2{font-size:26px}
  .grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .grid2{grid-template-columns:1fr}
  .impitem{grid-template-columns:auto minmax(0,1fr)}.impitem .meta{grid-column:1/-1}
  .impitem .ops{grid-template-columns:1fr}
  .logo b{font-size:22px}.logo-badge{width:48px;height:48px}
  .card{padding:20px;border-radius:26px;box-shadow:6px 6px 0 var(--ink)}

var API_URL = 'วางลิงก์เว็บแอปที่นี่';

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (USE_API) {
    return fetch(API_URL.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
      .catch(function () { throw new Error('เชื่อมต่อระบบไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); })
      .then(function (r) { return r.json().catch(function () { throw new Error('ระบบหลังบ้านตอบกลับไม่ถูกต้อง ตรวจสอบลิงก์ API_URL และการตั้งค่า "ผู้มีสิทธิ์เข้าถึง: ทุกคน"'); }); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด'); return j.data; });
  }
  if (GAS) {
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(new Error(e && e.message ? e.message : String(e))); });
      r[fn].apply(r, args);
    });
  }
  return new Promise(function (res, rej) {
    setTimeout(function () {
      try { res(JSON.parse(JSON.stringify(Mock[fn].apply(null, args)))); } catch (e) { rej(e); }
    }, 300);
  });
}

var Mock = (function () {

    tChangePassword: function (p, n) { chk(p); if (String(n).length < 4) throw new Error('รหัสผ่านใหม่ต้องยาวอย่างน้อย 4 ตัวอักษร'); pw = String(n); return { ok: true }; },

function buildReport(rs, bankArr, all) {
  var bank = {}; bankArr.forEach(function (x) { bank[x.id] = x; });
  var st = {}, dist = [0, 0, 0, 0, 0], items = {}, sum = 0, best = 0;
  rs.forEach(function (r) {
    sum += r.pct; best = Math.max(best, r.pct);
    dist[r.pct < 50 ? 0 : r.pct < 60 ? 1 : r.pct < 70 ? 2 : r.pct < 80 ? 3 : 4]++;
    var k = [r.name, r.grade, r.room].join('|');
    var s = st[k] || (st[k] = { name: r.name, grade: r.grade, room: r.room, certs: 0, attempts: 0, best: 0, sum: 0, last: '' });
    s.attempts++; s.sum += r.pct; s.best = Math.max(s.best, r.pct); s.last = r.timeText; if (r.certNo) s.certs++;
    r.detail.forEach(function (d) { var it = items[d.id] || (items[d.id] = { id: d.id, n: 0, correct: 0, picks: [0, 0, 0, 0] }); it.n++; if (d.ok) it.correct++; if (d.pick >= 0) it.picks[d.pick]++; });
  });
  var perStudent = Object.keys(st).map(function (k) { var s = st[k]; return { name: s.name, grade: s.grade, room: s.room, certs: s.certs, attempts: s.attempts, best: s.best, avg: Math.round(s.sum / s.attempts), last: s.last }; });
  var perQuestion = Object.keys(items).map(function (k) { var it = items[k], q = bank[it.id]; return { id: it.id, q: q ? q.q : '(ข้อสอบถูกลบแล้ว)', g: q ? q.g : '', s: q ? q.s : '', a: q ? q.a : -1, o: q ? q.o : [], n: it.n, correct: it.correct, p: Math.round(it.correct / it.n * 100) / 100, picks: it.picks }; }).sort(function (a, b) { return a.p - b.p; });
  var rooms = {}; TAMBONS.forEach(function (t) { rooms[t] = 1; });
  return { summary: { certs: rs.filter(function (r) { return !!r.certNo; }).length, attempts: rs.length, students: perStudent.length, avg: rs.length ? Math.round(sum / rs.length) : 0, best: best }, dist: dist, perStudent: perStudent, perQuestion: perQuestion,
    recent: rs.slice(-30).reverse().map(function (r) { return { time: r.timeText, name: r.name, grade: r.grade, room: r.room, certNo: r.certNo, quiz: r.quiz, strand: r.strand, score: r.score, total: r.total, pct: r.pct }; }), rooms: Object.keys(rooms) };

function viewQuiz() {
  var z = S.quiz, q = z.qs[z.idx], answered = z.picked !== -1, ok = answered && z.picked === q.a, total = z.qs.length;
  var pct = Math.round((z.idx + (answered ? 1 : 0)) / total * 100);
  var opts = q.o.map(function (t, i) {
    var cls = '';
    if (answered) cls = i === q.a ? ' right' : i === z.picked ? ' wrong' : ' dim';
    return '<button class="opt' + cls + '" data-act="pick" data-i="' + i + '"' + (answered ? ' disabled' : '') + '><span class="l">' + LET[i] + '</span><span class="t">' + esc(t) + '</span>' +
      (answered && i === q.a ? SVG.check : answered && i === z.picked ? SVG.cross : '') + '</button>';
  }).join('');
  var fb = answered ? '<div class="fb pop" style="background:' + (ok ? '#C8F2DA' : '#FFE3C2') + '"><div class="txt"><span class="ttl">' +
    (ok ? 'เก่งมาก! ตอบถูกต้อง' : 'เกือบแล้ว! คำตอบที่ถูกคือ ' + LET[q.a] + '. ' + esc(q.o[q.a])) + '</span><span style="font-size:17px;line-height:1.6">' + esc(q.ex) + '</span></div>' +
    '<button class="btn dark" data-act="next" id="nextBtn">' + (z.idx + 1 < total ? 'ข้อต่อไป' : 'ดูผลคะแนน') + SVG.next + '</button></div>' : '';
  var say = !answered ? 'อ่านโจทย์ช้า ๆ แล้วเลือกคำตอบที่ถูกที่สุดนะ!' : ok ? 'ถูกต้อง! รับไปเลย 1 ดาว' : 'ไม่เป็นไรนะ อ่านคำอธิบายแล้วไปต่อกัน!';
  var score = z.results.filter(function (r) { return r.ok; }).length;
  var dots = z.qs.map(function (x, i) { var r = z.results[i]; return '<span class="dot' + (r ? (r.ok ? ' ok' : ' no') : i === z.idx ? ' cur' : '') + '">' + (i + 1) + '</span>'; }).join('');
  var label = z.grade ? LV[z.grade].label : 'โหมดท้าทาย รวมทุกระดับ';
  return '<div class="qtop"><button class="btn sm" data-act="quitQuiz">' + SVG.back + 'ออก</button>' +
    '<span class="tag disp" style="background:' + GCOL[z.grade] + ';font-size:17px;padding:6px 16px;border-width:3px">' + label + '</span>' +
    '<div class="prog" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="ความคืบหน้า"><div style="width:' + pct + '%"></div></div>' +
    '<span class="disp" style="font-size:20px;font-weight:600">ข้อ ' + (z.idx + 1) + ' / ' + total + '</span></div>' +
    '<div class="qgrid"><div class="qcard pop"><div class="row"><span class="tag" style="background:' + STR[q.s].tint + '">' + STR[q.s].label + '</span><span class="tag" style="background:var(--cream)">' + lvShort(q.g) + '</span></div>' +
    '<h2>' + esc(q.q) + '</h2><div class="opts">' + opts + '</div>' + fb + '</div>' +
    '<aside class="side"><div class="helper" style="background:' + STR[q.s].tint + '"><div class="say">' + say + '</div><div class="bounce">' + SVG.icon(SICON[q.s], 150) + '</div></div>' +
    '<div class="soft"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="disp" style="font-size:19px;font-weight:600">ดาวในรอบนี้</span><span class="row" style="gap:6px">' + SVG.star(26) + '<b class="disp" style="font-size:24px">' + score + '</b></span></div><div class="dots">' + dots + '</div></div></aside></div>';
}

function viewResult() {
  var z = S.quiz, total = z.qs.length, score = z.results.filter(function (r) { return r.ok; }).length, pct = score / total;
  var n = pct === 1 ? 3 : pct >= 0.6 ? 2 : pct > 0 ? 1 : 0;

  var msg = ['ไม่เป็นไรเลย อ่านทบทวนคำตอบ แล้วลองใหม่อีกรอบนะ', 'เริ่มต้นได้ดีแล้ว อ่านคำอธิบายแล้วทำอีกครั้ง ต้องได้ดาวเพิ่มแน่นอน', 'เกือบเต็มแล้ว! ทบทวนข้อที่พลาดอีกนิดเดียว', 'ตอบถูกทุกข้อ! ลองโหมดท้าทายหรือหัวข้ออื่นต่อได้เลย'][n];

  var review = z.results.map(function (r, i) {
    var q = z.qs[i];
    return '<div class="review" style="background:' + (r.ok ? '#EFFBF4' : '#FFF1F3') + '"><span class="rnum" style="background:' + (r.ok ? 'var(--green)' : 'var(--pink)') + '">' + (i + 1) + '</span><div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:17px;line-height:1.5">' + esc(q.q) + '</b>' +
      (r.ok ? '' : '<span class="muted">คุณตอบ: ' + LET[r.pick] + '. ' + esc(q.o[r.pick]) + '</span>') +
      '<span style="font-weight:600;color:#1D7A4E">คำตอบที่ถูก: ' + LET[q.a] + '. ' + esc(q.o[q.a]) + '</span><span class="muted" style="font-size:15px">' + esc(q.ex) + '</span></div></div>';
  }).join('');
  var conf = '';

    for (var k = 0; k < 30; k++) { var w = 10 + (k % 3) * 4; conf += '<span class="confetti" style="left:' + ((k * 37 + 11) % 100) + '%;width:' + w + 'px;height:' + (w + 8) + 'px;background:' + cols[k % 6] + ';border-radius:' + (k % 2 ? '50%' : '4px') + ';animation-duration:' + (2.6 + (k % 5) * .6) + 's;animation-delay:' + ((k * .17) % 1.5).toFixed(2) + 's"></span>'; }
    conf = '<div class="confetti-layer" aria-hidden="true">' + conf + '</div>';
  }
  return conf + '<div class="card pop result"><div class="rleft"><div class="bounce">' + SVG.trophy + '</div><h2 style="font-size:34px">' + title + '</h2>' +
    '<div class="row" style="justify-content:center">' + SVG.star(52, n >= 1 ? '#FFC93C' : '#EFE7D6') + SVG.star(64, n >= 2 ? '#FFC93C' : '#EFE7D6') + SVG.star(52, n >= 3 ? '#FFC93C' : '#EFE7D6') + '</div>' +
    '<div><span class="disp" style="font-size:64px;font-weight:700;line-height:1">' + score + '</span><span class="disp" style="font-size:26px"> / ' + total + ' ข้อ</span></div>' +
    '<p style="margin:0;font-weight:500;line-height:1.6">' + msg + '</p>' + save +
    (z.res && z.res.certNo ? '<button class="btn green big pop" data-act="certFromResult">' + SVG.star(28) + 'รับเกียรติบัตร</button>' : (z.saved === 'ok' && pct * 100 < PASS_PCT ? '<span class="muted" style="font-size:14px">ได้ร้อยละ ' + PASS_PCT + ' ขึ้นไป รับเกียรติบัตรทันที</span>' : '')) +
    '<div class="row" style="justify-content:center"><button class="btn yellow" data-act="retry">ทำอีกครั้ง</button><button class="btn" data-act="goHome">เลือกระดับอื่น</button></div></div>' +
    '<div style="display:flex;flex-direction:column;gap:14px"><h3 style="font-size:26px">ทบทวนคำตอบ</h3>' + review + '</div></div>';
}

function warnOf(x) {
  if (x.o.length < 4) return 'พบตัวเลือกเพียง ' + x.o.length + ' ข้อ ต้องมี 4 ตัวเลือก (แก้ไขภายหลังในคลังข้อสอบได้หลังเพิ่มตัวเลือกในไฟล์)';
  if (x.a < 0) return 'ยังไม่พบเฉลย เลือกเฉลยทางขวาก่อนนำเข้า';
  return '';
}

function pLabel(p) {

}

    '<div class="grid2" style="margin-top:24px;align-items:start"><div class="soft"><h3 style="font-size:20px;margin-bottom:4px">การกระจายของคะแนน</h3><p class="muted" style="margin:0 0 10px;font-size:14px">จำนวนครั้งที่ทำข้อสอบ แยกตามช่วงร้อยละของคะแนน</p><div class="bars">' + bars + '</div><div class="blabels">' + bands.map(function (b) { return '<span>' + b + '</span>'; }).join('') + '</div></div>' +

function render() {
  var v = S.view, body;
  if (v === 'home') body = viewHome();
  else if (v === 'quiz') body = viewQuiz();
  else if (v === 'result') body = viewResult();
  else if (v === 'history') body = viewHistory();
  else if (v === 'cert') body = viewCert();
  else if (v === 'tlogin') body = viewTLogin();
  else if (v === 'teacher') body = viewTeacher();
  else body = viewWelcome();
  document.getElementById('app').innerHTML = nav() + '<main>' + body + '</main>';
  var af = document.querySelector('[autofocus]'); if (af) af.focus();
}
function go(v) { S.view = v; render(); window.scrollTo(0, 0); }

/* ================= การทำงาน ================= */
function loadSummary() { return api('getSummary').then(function (s) { S.summary = s; if (s.cert) CERT = s.cert; if (s.passPct) PASS_PCT = s.passPct; if (S.view === 'home' || (S.view === 'welcome' && !document.activeElement.closest('form'))) render(); }).catch(function (e) { toast(e.message, true); }); }
function loadBank() { return api('tListQuestions', S.tpw).then(function (b) { S.bank = b; if (S.view === 'teacher') render(); }).catch(teacherErr); }
function loadReport() { S.report = null; if (S.tab === 'report') render(); return api('tReport', S.tpw, S.rf).then(function (r) { S.report = r; if (S.view === 'teacher' && S.tab === 'report') render(); }).catch(teacherErr); }
function teacherErr(e) { toast(e.message, true); if (/รหัสผ่าน/.test(e.message)) { S.tpw = null; sstore('wsn_tpw', null); go('tlogin'); } }

function startQuiz(g) {
  busy('กำลังเตรียมข้อสอบ...');
  api('getQuiz', g, S.strand, S.count).then(function (qs) {
    busy();
    if (!qs.length) { toast('ยังไม่มีข้อสอบในระดับหรือหัวข้อที่เลือก', true); return; }
    S.quiz = { grade: g, strand: S.strand, qs: qs, idx: 0, picked: -1, results: [], saved: '' };
    go('quiz');
  }).catch(function (e) { busy(); toast(e.message, true); });
}

function saveResult() {
  var z = S.quiz, st = S.student;
  z.saved = 'saving'; render();
  api('submitResult', { name: st.name, grade: st.grade, room: st.room, quizGrade: z.grade, strand: z.strand,
    answers: z.results.map(function (r, i) { return { id: z.qs[i].id, pick: r.pick }; }) })
    .then(function (r) { z.saved = 'ok'; z.res = r; if (S.view === 'result') render(); })
    .catch(function (e) { z.saved = 'err'; if (S.view === 'result') render(); toast('ส่งคะแนนไม่สำเร็จ: ' + e.message, true); });
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); var fn = FORM[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fileIn') { var file = e.target.files && e.target.files[0]; e.target.value = ''; handleFile(file); return; }
  var el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el);
});
document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el);
});
document.addEventListener('dragover', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', function (e) {
  var d = e.target.closest && e.target.closest('#drop'); if (!d) return;
  e.preventDefault(); d.classList.remove('over'); handleFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
});

/* ================= อ่านไฟล์ข้อสอบ ================= */
var LETTER_IDX = { 'ก': 0, 'ข': 1, 'ค': 2, 'ง': 3, a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
var KW_PROCESS = ['วิธีการทางวิทยาศาสตร์', 'ทักษะกระบวนการ', 'สมมติฐาน', 'ตัวแปร', 'โครงงาน', 'การสังเกต', 'ข้อมูล', 'การทดลอง'];
var KW_ASTRO = ['ดวงอาทิตย์', 'ดวงจันทร์', 'ดาว', 'อวกาศ', 'ดาวเทียม', 'สุริยุปราคา', 'จันทรุปราคา', 'ข้างขึ้น', 'ฤดู', 'ปีแสง', 'กลางวัน'];
var KW_MATTER = ['สาร', 'ธาตุ', 'สารละลาย', 'กรด', 'เบส', 'pH', 'ปิโตรเลียม', 'พอลิเมอร์', 'พลาสติก', 'การแยก', 'สถานะ', 'ละลาย', 'เคมี'];
var KW_LIFE = ['พืช', 'สัตว์', 'ร่างกาย', 'อวัยวะ', 'อาหาร', 'สิ่งมีชีวิต', 'ผีเสื้อ', 'ราก', 'ใบ', 'ดอก', 'ย่อย', 'เซลล์', 'กระดูก', 'หัวใจ', 'ปอด', 'โซ่อาหาร', 'ลำไส้', 'พันธุกรรม'];
var KW_EARTH = ['ดวงอาทิตย์', 'ดวงจันทร์', 'ดาว', 'โลก', 'ดิน', 'หิน', 'เมฆ', 'หมอก', 'ฝน', 'ฟ้า', 'อวกาศ', 'ลม', 'อากาศ', 'ฤดู', 'ภูเขา', 'น้ำค้าง', 'สุริยุปราคา', 'จันทรุปราคา'];
var KW_PHYS = ['เสียง', 'แสง', 'แรง', 'ไฟฟ้า', 'แม่เหล็ก', 'สาร', 'พลังงาน', 'ความร้อน', 'สถานะ', 'ละลาย', 'วัสดุ'];

function guessStrand(q, opts) {
  var has = function (t, l) { return l.some(function (k) { return t.indexOf(k) !== -1; }); };
  var order = [['process', KW_PROCESS], ['astro', KW_ASTRO], ['life', KW_LIFE.concat(['สิ่งแวดล้อม', 'นิเวศ', 'ทรัพยากร', 'เรือนกระจก', 'DNA', 'ยีน'])], ['matter', KW_MATTER], ['energy', KW_PHYS]];
  for (var i = 0; i < order.length; i++) if (has(q, order[i][1])) return order[i][0];
  for (var j = 0; j < order.length; j++) if (has(opts, order[j][1])) return order[j][0];
  return 'energy';
}

function parseQuestions(text) {
  var head = text.slice(0, 400);
  var g = /ม\.?\s*ปลาย|มัธยมศึกษาตอนปลาย|31001/.test(head) ? 3 : /ม\.?\s*ต้น|มัธยมศึกษาตอนต้น|21001/.test(head) ? 2 : 1;
  var lines = [];
  text.replace(/\r/g, '').split('\n').forEach(function (l) {
    l = l.replace(/ /g, ' ').trim(); if (!l) return;
    l.split(/\s+(?=\*?\(?[กขคง][\.\)]\s*\S)/).forEach(function (p) { if (p.trim()) lines.push(p.trim()); });
  });
  var qRe = /^(?:ข้อ(?:ที่)?\s*)?(\d{1,3})\s*[\.\)]\s*(.+)$/;
  var oRe = /^(\*)?\(?([กขคงabcdABCD])[\.\)]\s*(.+)$/;
  var aRe = /^(?:ตอบ|เฉลย|คำตอบ|answer)\s*[:：\-]?\s*(?:ข้อ\s*)?\(?([กขคงabcdABCD1-4])/i;
  var exRe = /^(?:คำอธิบาย|อธิบาย|เหตุผล)\s*[:：\-]?\s*(.+)$/;
  var out = [], cur = null;
  lines.forEach(function (l) {
    var m;
    if ((m = l.match(aRe)) && cur) { cur.a = LETTER_IDX[m[1].toLowerCase()]; return; }
    if ((m = l.match(exRe)) && cur) { cur.ex = m[1]; return; }
    if ((m = l.match(oRe)) && cur) { if (m[1]) cur.a = cur.o.length; cur.o.push(m[3].trim()); return; }
    if ((m = l.match(qRe))) { cur = { q: m[2].trim(), o: [], a: -1, ex: '' }; out.push(cur); return; }
    if (cur && cur.o.length === 0) cur.q += ' ' + l;
    else if (cur && cur.ex) cur.ex += ' ' + l;
  });
  return out.map(function (x) {
    return { q: x.q, o: x.o.slice(0, 4), a: x.a, ex: x.ex, g: g, s: guessStrand(x.q, x.o.join(' ')), include: x.o.length >= 4 && x.a >= 0 };
  });
}

function readDocx(buf) {
  var u8 = new Uint8Array(buf), dv = new DataView(buf), e = -1;
  for (var i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) { if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; } }
  if (e < 0) return Promise.reject(new Error('zip'));
  var count = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true);
  for (var n = 0; n < count; n++) {
    var method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    var nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    if (name === 'word/document.xml') {
      var start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
      var data = u8.subarray(start, start + csize);
      var bytesP = method === 8 ? new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function (b) { return new Uint8Array(b); }) : Promise.resolve(data);
      return bytesP.then(function (bytes) {
        var xml = new TextDecoder().decode(bytes);
        return xml.split(/<\/w:p>/).map(function (para) {
          return (para.match(/<w:t(?:\s[^>]*)?>[^<]*<\/w:t>|<w:tab\s*\/>|<w:br\s*\/>/g) || []).map(function (x) {
            if (/^<w:tab/.test(x)) return ' '; if (/^<w:br/.test(x)) return '\n'; return x.replace(/<[^>]+>/g, '');
          }).join('');
        }).join('\n').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
      });
    }
    p += 46 + nlen + xlen + clen;
  }
  return Promise.reject(new Error('doc'));
}

function toBase64(file) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(file); });
}

function handleFile(file) {
  if (!file) return;
  var name = file.name || 'ไฟล์', ext = (name.split('.').pop() || '').toLowerCase();
  var isImg = /^image\//.test(file.type) || ['jpg', 'jpeg', 'png', 'webp'].indexOf(ext) !== -1;
  var fail = function (msg, raw) { S.imp = { step: 'error', file: name, err: msg, raw: raw || '' }; render(); };
  if (ext === 'doc') return fail('ไฟล์ .doc แบบเก่ายังอ่านไม่ได้ กรุณาเปิดใน Word แล้วบันทึกเป็น .docx ก่อนแนบใหม่');
  if (['docx', 'txt', 'pdf'].indexOf(ext) === -1 && !isImg) return fail('รองรับเฉพาะ Word (.docx), PDF, รูปภาพ JPG/PNG และไฟล์ .txt');
  if (file.size > 10 * 1024 * 1024) return fail('ไฟล์ใหญ่เกิน 10 MB กรุณาแบ่งไฟล์หรือลดขนาดรูปก่อนแนบ');
  S.imp = { step: 'reading', file: name, note: ext === 'docx' ? 'กำลังดึงข้อความจากเอกสาร Word' : ext === 'txt' ? 'กำลังอ่านข้อความ' : 'กำลังอ่านตัวอักษรจากภาพด้วย OCR อาจใช้เวลาประมาณ 10–30 วินาที' };
  render();
  var textP;
  if (ext === 'docx') textP = file.arrayBuffer().then(readDocx).catch(function () { throw new Error('เปิดไฟล์ Word นี้ไม่ได้ ไฟล์อาจเสียหายหรือมีรหัสผ่าน'); });
  else if (ext === 'txt') textP = file.text();
  else textP = toBase64(file).then(function (b64) {
    return api('tExtractText', S.tpw, { name: name, mimeType: file.type || (ext === 'pdf' ? 'application/pdf' : 'image/jpeg'), data: b64 });
  }).then(function (r) { return r.text; });
  textP.then(function (text) {
    var items = parseQuestions(text || '');
    if (!items.length) return fail('ไม่พบข้อสอบในไฟล์นี้ ลองจัดรูปแบบตามตัวอย่าง: เลขข้อ ตัวเลือก ก–ง และบรรทัด “ตอบ”', text);
    S.imp = { step: 'review', file: name, items: items, raw: text }; render();
  }).catch(function (e) { if (/รหัสผ่าน/.test(e.message)) return teacherErr(e); fail(e.message); });
}

/* ================= เกียรติบัตร ================= */
function tambonList() { return (S.summary && S.summary.tambons) || TAMBONS; }
function thaiDateJs(d) {
  var m = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  return d.getDate() + ' ' + m[d.getMonth()] + ' พ.ศ. ' + (d.getFullYear() + 543);
}
function openCert(c, back) {
  S.cert = c; S.certImg = ''; S.certBack = back; go('cert');
  drawCert(c).then(function (url) { S.certImg = url; if (S.view === 'cert') render(); }).catch(function (e) { toast('สร้างเกียรติบัตรไม่สำเร็จ: ' + e.message, true); });
}
function viewCert() {
  var c = S.cert, file = 'เกียรติบัตร-' + c.name.replace(/\s+/g, '_') + '.png';
  var img = S.certImg ? '<img src="' + S.certImg + '" alt="เกียรติบัตรของ ' + esc(c.name) + '" style="width:100%;display:block;border-radius:18px">' : '<div class="empty" style="aspect-ratio:1.414;display:flex;align-items:center;justify-content:center;gap:12px"><span class="spinner"></span>กำลังสร้างเกียรติบัตร...</div>';
  return '<div class="row" style="margin-bottom:18px"><button class="btn sm" data-act="certBack">' + SVG.back + 'กลับ</button><h2 style="font-size:30px">เกียรติบัตรของคุณ</h2></div>' +
    '<div class="card pop" style="padding:14px">' + img + '</div>' +
    '<div class="row" style="justify-content:center;margin-top:22px">' +
    (S.certImg ? '<a class="btn yellow big" href="' + S.certImg + '" download="' + esc(file) + '">บันทึกเป็นรูปภาพ</a>' : '') +
    '<button class="btn big" data-act="certPrint"' + (S.certImg ? '' : ' disabled') + '>พิมพ์ / บันทึกเป็น PDF</button></div>' +
    '<p class="muted" style="text-align:center;font-size:14px;margin-top:12px">บนมือถือ กดค้างที่รูปเกียรติบัตรเพื่อบันทึกลงเครื่องได้</p>';
}
function printCert() {
  var old = document.getElementById('printArea'); if (old) old.remove();
  var d = document.createElement('div'); d.id = 'printArea'; d.innerHTML = '<img src="' + S.certImg + '" alt="">';
  document.body.appendChild(d);
  setTimeout(function () { window.print(); }, 200);
}
function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function starPath(x, cx, cy, R1, r1, n) { x.beginPath(); for (var i = 0; i < n * 2; i++) { var rad = i % 2 ? r1 : R1, ang = Math.PI / n * i - Math.PI / 2; x.lineTo(cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)); } x.closePath(); }
function drawCert(c) {
  var W = 1600, H = 1131, INKC = '#1F2346', GOLD = '#C9A227';
  var FD = "'Mitr', 'Prompt', sans-serif", FB = "'IBM Plex Sans Thai Looped', 'Sarabun', sans-serif";
  var fontsP = document.fonts ? Promise.all(['700 40px Mitr', '600 40px Mitr', '500 40px Mitr', '500 20px "IBM Plex Sans Thai Looped"', '400 20px "IBM Plex Sans Thai Looped"'].map(function (f) { return document.fonts.load(f, 'กขค'); })).catch(function () {}) : Promise.resolve();
  var sigSrcP = SIG !== null ? Promise.resolve(SIG) : api('getSignature').then(function (d) { SIG = d || ''; return SIG; }).catch(function () { return ''; });
  var sigP = sigSrcP.then(function (src) { return new Promise(function (res) { if (!src) return res(null); var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = src; }); });
  return Promise.all([fontsP, sigP]).then(function (arr) {
    var sig = arr[1];
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var x = cv.getContext('2d');
    x.fillStyle = '#FFFDF5'; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(201,162,39,.12)';
    for (var i = 40; i < W; i += 30) for (var j = 40; j < H; j += 30) { x.beginPath(); x.arc(i, j, 1.6, 0, 7); x.fill(); }
    rr(x, 28, 28, W - 56, H - 56, 36); x.lineWidth = 12; x.strokeStyle = INKC; x.stroke();
    rr(x, 56, 56, W - 112, H - 112, 24); x.lineWidth = 4; x.strokeStyle = GOLD; x.stroke();
    rr(x, 68, 68, W - 136, H - 136, 18); x.lineWidth = 1.5; x.stroke();
    [[96, 96], [W - 96, 96], [96, H - 96], [W - 96, H - 96]].forEach(function (p) { starPath(x, p[0], p[1], 18, 8, 5); x.fillStyle = '#FFC93C'; x.fill(); x.lineWidth = 2.5; x.strokeStyle = INKC; x.stroke(); });
    // atom emblem
    x.save(); x.translate(W / 2, 150);
    x.beginPath(); x.arc(0, 0, 58, 0, 7); x.fillStyle = '#FFC93C'; x.fill(); x.lineWidth = 5; x.strokeStyle = INKC; x.stroke();
    x.lineWidth = 3.5; [0, 60, -60].forEach(function (d) { x.save(); x.rotate(d * Math.PI / 180); x.beginPath(); x.ellipse(0, 0, 42, 16, 0, 0, 7); x.stroke(); x.restore(); });
    x.beginPath(); x.arc(0, 0, 9, 0, 7); x.fillStyle = '#FF5D7A'; x.fill(); x.stroke(); x.restore();
    function t(txt, y, font, color, maxW, cx) {
      var m = font.match(/(\d+)px/), size = Number(m[1]);
      x.font = font; while (x.measureText(txt).width > (maxW || 1300) && size > 14) { size -= 2; x.font = font.replace(/\d+px/, size + 'px'); }
      x.fillStyle = color; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
      var tw = x.measureText(txt).width;
      x.fillText(txt, Math.round((cx || W / 2) - tw / 2), y);
    }
    t('เกียรติบัตร', 300, '700 100px ' + FD, INKC);
    t(CERT.org, 368, '500 36px ' + FD, INKC);
    t('ขอมอบเกียรติบัตรฉบับนี้ไว้เพื่อแสดงว่า', 440, '500 30px ' + FB, '#4A4F6E');
    t(c.name, 540, '600 78px ' + FD, '#2F5BE0', 1150);
    x.setLineDash([4, 10]); x.lineWidth = 3; x.strokeStyle = GOLD; x.beginPath(); x.moveTo(W / 2 - 460, 572); x.lineTo(W / 2 + 460, 572); x.stroke(); x.setLineDash([]);
    t('ผู้เรียน' + (LV[c.grade] ? LV[c.grade].label : '') + '  ' + c.room, 632, '500 30px ' + FB, INKC);
    var subj = c.quizGrade && LV[c.quizGrade] ? 'รายวิชาวิทยาศาสตร์ (' + LV[c.quizGrade].code + ') ' + LV[c.quizGrade].label : 'วิชาวิทยาศาสตร์ โหมดท้าทาย รวมทุกระดับ';
    t('ได้ผ่านการทดสอบ' + subj + (c.strand && c.strand !== 'ทุกหัวข้อ' ? ' หัวข้อ' + c.strand : ''), 690, '500 30px ' + FB, INKC);
    t('ด้วยคะแนน ' + c.score + ' จาก ' + c.total + ' ข้อ คิดเป็นร้อยละ ' + c.pct, 752, '600 36px ' + FD, '#1D7A4E');
    t('ให้ไว้ ณ วันที่ ' + (c.certDate || thaiDateJs(new Date())), 812, '500 28px ' + FB, INKC);
    // seal
    var sx = 380, sy = 890;
    x.fillStyle = '#FF5D7A'; x.strokeStyle = INKC; x.lineWidth = 3;
    [[-34, 1], [34, -1]].forEach(function (rb) { x.beginPath(); x.moveTo(sx + rb[0] - 22, sy + 40); x.lineTo(sx + rb[0] + 22, sy + 40); x.lineTo(sx + rb[0] + 22 + rb[1] * 6, sy + 130); x.lineTo(sx + rb[0] + rb[1] * 3, sy + 112); x.lineTo(sx + rb[0] - 22 + rb[1] * 6, sy + 130); x.closePath(); x.fill(); x.stroke(); });
    starPath(x, sx, sy, 92, 80, 24); x.fillStyle = GOLD; x.fill(); x.lineWidth = 4; x.stroke();
    x.beginPath(); x.arc(sx, sy, 66, 0, 7); x.fillStyle = '#FFE27A'; x.fill(); x.lineWidth = 3; x.stroke();
    t('ผ่านเกณฑ์', sy - 4, '600 24px ' + FD, INKC, 104, sx);
    t('ร้อยละ ' + PASS_PCT, sy + 28, '500 20px ' + FD, INKC, 104, sx);
    // signature block
    var bx = 1130;
    if (sig) { var sh = 118, sw = sig.width * sh / sig.height; x.drawImage(sig, bx - sw / 2, 850, sw, sh); }
    else { x.setLineDash([8, 8]); x.strokeStyle = '#9CA0C0'; x.lineWidth = 2; rr(x, bx - 150, 856, 300, 108, 14); x.stroke(); x.setLineDash([]); t('[ลายเซ็น]', 918, '500 22px ' + FB, '#9CA0C0', 280, bx); }
    x.strokeStyle = INKC; x.lineWidth = 1.5; x.beginPath(); x.moveTo(bx - 210, 975); x.lineTo(bx + 210, 975); x.stroke();
    t('(' + CERT.signer + ')', 1012, '500 30px ' + FB, INKC, 620, bx);
    t(CERT.position, 1052, '500 22px ' + FB, INKC, 700, bx);
    x.textAlign = 'left'; x.font = '500 20px ' + FB; x.fillStyle = '#4A4F6E';
    x.fillText('เลขที่ ' + (c.certNo || '-'), 136, H - 100);
    return cv.toDataURL('image/png');
  });
}

/* ================= เริ่มต้น ================= */
(function init() {
  var pw = sstore('wsn_tpw'); if (pw) S.tpw = pw;
  render();
  loadSummary();
})();
</script>
